[project]
name = "behavior-detection-lite"
version = "0.1.0"
description = "Lightweight uniform, smoking and sleeping detection extracted from EasyAIoT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3,<4",
    "opencv-python>=4.8",
    "ultralytics>=8.4,<9",
]

[project.scripts]
behavior-detect = "behavior_detection.cli:main"
behavior-api = "behavior_detection.api:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_detection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
