name: industrial-vision-behavior-system

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - BEHAVIOR_MODELS=workwear,smoking,sleeping
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - API_BASE=http://backend:8000
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm start"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
